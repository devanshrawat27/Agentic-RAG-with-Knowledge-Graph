<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 620" fill="none">
  <defs>
    <linearGradient id="silver" x1="125" y1="90" x2="420" y2="560" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset=".28" stop-color="#E7EBF0"/>
      <stop offset=".55" stop-color="#AAB2BD"/>
      <stop offset=".76" stop-color="#F7F9FB"/>
      <stop offset="1" stop-color="#6E7783"/>
    </linearGradient>
    <linearGradient id="silverDark" x1="130" y1="170" x2="390" y2="500" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F2F4F7"/>
      <stop offset=".45" stop-color="#9AA3AE"/>
      <stop offset="1" stop-color="#515A66"/>
    </linearGradient>
    <linearGradient id="blackGloss" x1="170" y1="120" x2="350" y2="285" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1A1E24"/>
      <stop offset=".5" stop-color="#030405"/>
      <stop offset="1" stop-color="#11151A"/>
    </linearGradient>
    <linearGradient id="blueWhite" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FFFFFF"/>
      <stop offset=".5" stop-color="#EEF3F8"/>
      <stop offset="1" stop-color="#AAB4C0"/>
    </linearGradient>
    <filter id="soft" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .float{animation:float 5.5s ease-in-out infinite;transform-origin:260px 310px}
      .eyes{animation:blink 4.8s ease-in-out infinite;transform-origin:260px 195px}
      @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
      @keyframes blink{0%,44%,48%,100%{transform:scaleY(1)}46%{transform:scaleY(.12)}}
      @media(prefers-reduced-motion:reduce){.float,.eyes{animation:none}}
    </style>
  </defs>

  <!-- Transparent SVG: no background, no card, no floor -->

  <g class="float">
    <!-- head / helmet -->
    <rect x="112" y="60" width="296" height="220" rx="88"
          fill="url(#silver)" stroke="#FFFFFF" stroke-opacity=".55" stroke-width="3"/>
    <!-- side ear modules -->
    <rect x="95" y="138" width="30" height="76" rx="15"
          fill="url(#silverDark)" stroke="#FFFFFF" stroke-opacity=".35" stroke-width="2"/>
    <rect x="395" y="138" width="30" height="76" rx="15"
          fill="url(#silverDark)" stroke="#FFFFFF" stroke-opacity=".35" stroke-width="2"/>
    <circle cx="110" cy="176" r="8" fill="#626B76"/>
    <circle cx="410" cy="176" r="8" fill="#626B76"/>

    <!-- glossy visor -->
    <rect x="142" y="110" width="236" height="116" rx="50"
          fill="url(#blackGloss)" stroke="#4D5661" stroke-width="2"/>
    <path d="M174 120C205 101 316 99 346 119" stroke="#FFFFFF" stroke-opacity=".18" stroke-width="7" stroke-linecap="round"/>

    <!-- eyes -->
    <g class="eyes" filter="url(#soft)">
      <rect x="189" y="154" width="43" height="35" rx="17.5" fill="url(#blueWhite)"/>
      <rect x="288" y="154" width="43" height="35" rx="17.5" fill="url(#blueWhite)"/>
    </g>

    <!-- neck -->
    <rect x="222" y="268" width="76" height="38" rx="17" fill="url(#silverDark)" stroke="#FFFFFF" stroke-opacity=".34"/>

    <!-- torso -->
    <path d="M160 292C182 273 214 266 260 266C306 266 338 273 360 292L395 462C400 489 382 511 355 517C299 529 221 529 165 517C138 511 120 489 125 462L160 292Z"
          fill="url(#silver)" stroke="#FFFFFF" stroke-opacity=".52" stroke-width="3"/>
    <path d="M180 317C205 298 230 293 260 293C290 293 315 298 340 317L356 430C324 448 196 448 164 430Z"
          fill="#7F8894" opacity=".13"/>

    <!-- chest emblem -->
    <circle cx="260" cy="370" r="45" fill="#10141A" stroke="#FFFFFF" stroke-opacity=".34" stroke-width="2"/>
    <path d="M260 345L284 359L277 389L260 402L236 388L243 358Z"
          fill="url(#silverDark)" stroke="#FFFFFF" stroke-opacity=".72" stroke-width="2"/>
    <path d="M260 345V374L277 389M260 374L243 358" stroke="#5F6874" stroke-width="3" stroke-linecap="round"/>

    <!-- left arm relaxed -->
    <circle cx="150" cy="305" r="19" fill="url(#silverDark)" stroke="#FFFFFF" stroke-opacity=".44" stroke-width="2"/>
    <path d="M135 321C112 340 99 365 100 396C101 417 111 432 126 438"
          stroke="url(#silver)" stroke-width="27" stroke-linecap="round"/>
    <path d="M126 438C115 450 115 468 126 480"
          stroke="url(#silverDark)" stroke-width="19" stroke-linecap="round"/>
    <path d="M126 478C117 486 118 498 127 505" stroke="#A9B2BD" stroke-width="9" stroke-linecap="round"/>

    <!-- right arm raised / pointing -->
    <circle cx="370" cy="304" r="19" fill="url(#silverDark)" stroke="#FFFFFF" stroke-opacity=".44" stroke-width="2"/>
    <path d="M384 317C401 304 418 292 430 274C440 260 451 246 464 236"
          stroke="url(#silver)" stroke-width="28" stroke-linecap="round"/>

    <!-- forearm / wrist -->
    <path d="M430 274C442 258 450 244 462 231"
          stroke="url(#silverDark)" stroke-width="22" stroke-linecap="round"/>
    <rect x="456" y="214" width="31" height="48" rx="14" fill="url(#silverDark)"
          transform="rotate(27 456 214)" stroke="#FFFFFF" stroke-opacity=".4"/>

    <!-- pointing hand -->
    <g transform="translate(470 216) rotate(27)">
      <circle cx="2" cy="16" r="11" fill="url(#silverDark)" stroke="#FFFFFF" stroke-opacity=".4"/>
      <path d="M3 14C12 2 22 -6 33 -10" stroke="url(#silver)" stroke-width="11" stroke-linecap="round"/>
      <path d="M8 23C18 18 28 18 37 21" stroke="url(#silver)" stroke-width="8" stroke-linecap="round"/>
      <path d="M1 28C10 27 18 31 24 37" stroke="url(#silverDark)" stroke-width="7" stroke-linecap="round"/>
    </g>

    <!-- waist -->
    <rect x="185" y="494" width="150" height="34" rx="17" fill="url(#silverDark)" stroke="#FFFFFF" stroke-opacity=".34"/>

    <!-- legs -->
    <path d="M193 515C191 540 188 562 183 585C180 600 189 611 204 614C220 617 232 608 235 596L241 527Z"
          fill="url(#silverDark)" stroke="#FFFFFF" stroke-opacity=".35"/>
    <path d="M327 515C329 540 332 562 337 585C340 600 331 611 316 614C300 617 288 608 285 596L279 527Z"
          fill="url(#silverDark)" stroke="#FFFFFF" stroke-opacity=".35"/>

    <!-- subtle seams -->
    <g stroke="#56616D" stroke-opacity=".28" stroke-width="2">
      <path d="M176 415C219 428 301 428 344 415"/>
      <path d="M210 539C225 547 242 550 256 550"/>
      <path d="M310 539C295 547 278 550 264 550"/>
    </g>
  </g>
</svg>